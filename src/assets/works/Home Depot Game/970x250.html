<!DOCTYPE html><html><head>
<meta charset="UTF-8">
<meta name="ad.frame" content="child">
<title>ACE - Ad Building Framework</title>
<style>

*,
*::after,
*::before,
html {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
  text-rendering: optimizeLegibility;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

#container {
  width: 970px;
  height: 250px;
  position: relative;
  cursor: pointer;
}

.frame {
  position: absolute;
  top: 0;
  height: 100%;
}

.left {
  left: 0;
  width: 466px;
}

#logo-lockup {
  position: absolute;
  width: 100%;
  height: 100%;
  background: transparent url("assets-970x250/logo-lockup.png") top left no-repeat;
}

#text, #text-1, #text-2 {
  width: 100%;
  height: 100%;
  position: absolute;
}

#text-1 {
  background: transparent url("assets-970x250/text-frame-1.png") top left no-repeat;
}

#text-2 {
  background: transparent url("assets-970x250/text-frame-2.png") top left no-repeat;
  opacity: 0;
}

.right {
  right: 0;
  width: 504px;
}

#icons {
  opacity: 0;
  position: absolute;
  bottom: 5px;
  width: 100%;
  height: 50px;
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 5px;
}

.icon {
  width: 55px;
  height: 50px;
}

.icon .pulse {
  width: 100%;
  height: 100%;
  position: absolute;
}

#icon-1 {
  background: transparent url("assets-970x250/icon-1-largeTub.jpg") top left no-repeat;
}

#icon-2 {
  background: transparent url("assets-970x250/icon-2-smallTub.jpg") top left no-repeat;
}

#icon-3 {
  background: transparent url("assets-970x250/icon-3-shelves.jpg") top left no-repeat;
}

#bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 15px;
  background-color: #fff;
}

#room {
  width: 100%;
  height: 100%;
  background: transparent url("assets-970x250/room-frame.png") top left no-repeat;
}

#closet {
  width: 100%;
  height: 100%;
  background: transparent url("assets-970x250/closet-empty.png") top left no-repeat;
}

.closet {
  opacity: 0;
  position: absolute;
  width: 100%;
  height: 100%;
}

#messy {
  opacity: 1;
  background: transparent url("assets-970x250/closet-messy.png") top left no-repeat;
}

#finished {
  background: transparent url("assets-970x250/closet-finished.png") top left no-repeat;
}

#shelves {
  background: transparent url("assets-970x250/closet-shelves.png") top left no-repeat;
}

#totes-big {
  background: transparent url("assets-970x250/closet-totes-big.png") top left no-repeat;
}

#totes-small {
  background: transparent url("assets-970x250/closet-totes-small.png") top left no-repeat;
}

#instructions {
  width: 100%;
  height: 100%;
  position: absolute;
  background: transparent url("assets-970x250/instructions.png") top left no-repeat;
}

#error {
  opacity: 0;
  background-color: #f96302;
  color: #fff;
  width: 30%;
  height: 10%;
  position: absolute;
  top: 50%;
  left: 50%;
  margin-left: -15%;
  margin-top: -5%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  font-size: 12px;
  text-align: center;
  font-weight: bold;
  user-select: none;
  pointer-events: none;
}

.pulse {
  border: 2px solid #f96302;
  pointer-events: none;
}

#play-pulse {
  width: 100px;
  height: 30px;
  position: absolute;
  left: 202px;
  top: 124px;
}

#replay {
  width: 125px;
  height: 38px;
  position: absolute;
  top: 10px;
  right: 10px;
  background: transparent url("assets-970x250/btn-replay.jpg") top left no-repeat;
  opacity: 0;
  pointer-events: none;
};
</style>
<script src="/assets/libraries/gsap.min.js"></script>
<script src="/assets/libraries/Draggable.min.js"></script>
<script src="/assets/libraries/AD.js"></script>
</head>

<body>
  <div id="container">
    <div class="frame left">
      <div id="text">
        <div id="text-1" class="text"></div>
        <div id="text-2" class="text"></div>
      </div>
      <div id="logo-lockup"></div>
    </div>
    <div class="frame right">
      <div id="closet">
        <div id="messy" class="closet"></div>
        <div id="finished" class="closet"></div>
        <div id="shelves" class="closet"></div>
        <div id="totes-big" class="closet"></div>
        <div id="totes-small" class="closet"></div>
      </div>
      <div id="room" class="frame"></div>
      <div id="bar"></div>
      <div id="icons">
        <div id="icon-1" class="icon"><div class="pulse"></div></div>
        <div id="icon-2" class="icon"><div class="pulse"></div></div>
        <div id="icon-3" class="icon"><div class="pulse"></div></div>
      </div>
      <div id="instructions" class="frame">
        <div id="play-pulse" class="pulse"></div>
      </div>
      <div id="error">
        <div id="error-text">You need shelves first</div>
      </div>
      <div id="replay"></div>
    </div>
  </div>

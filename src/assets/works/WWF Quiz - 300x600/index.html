function handleClick(e) {
    "btn-start" === e.target.id ? startQuiz() : (console.log("firing default clickthrough"), $AD.click("clickthrough"));
}
function handleCustomEvents(e) {
    var data = e.detail;
    switch (e.type) {
        case "additional cta click":
            showEndScreen();
            break;
        case "cta click":
            $AD.click("clickthrough.panel." + data.result.id, { overrides: { url: data.result.url } });
            break;
        case "option selected":
            $AD.event("interaction.custom." + data.id);
            break;
        case "results shown":
            $AD.event("other.view." + data.result.id);
            var h2 = document.querySelector(".results").querySelector("h2");
            h2 && (h2.innerHTML = h2.innerHTML.replace(/\*([^*]+)\*/g, "<span>$1</span>"));
    }
}
function toggleActive(element) {
    element.classList.contains("active")
        ? (element.classList.add("inactive"), element.classList.remove("active"))
        : element.classList.contains("inactive") &&
          (element.classList.add("active"), element.classList.remove("inactive"));
}

function startQuiz() {
    new QuizProfiler(quizData).init(),

        toggleActive($AD.Utilities.byId("intro-frame")),

function init() {
    ($AD.Utilities.byId("btn-start").onclick = handleClick),
        ($AD.Utilities.byId("btn-adopt").onclick = handleClick),
        ($AD.Utilities.byId("hit-btn").onclick = handleClick),

$AD.ready(init);
function QuizProfiler(config) {
    var conf = {
        container: undefined,
        multiSelect: undefined,
        shuffle: undefined,
        questions: undefined,
        results: undefined,
    };
    (this.currentQuestionIndex = 0),
        (this.config = $AD.Utilities.deepMerge(conf, config)),
        (this.container = undefined);
}
function customEvent(name, meta) {
    name = new CustomEvent(name, { detail: meta, bubbles: !0 });
    document.dispatchEvent(name);
}
QuizProfiler.prototype = {
    init: function () {
        (this.container = this.config.container), this.createQuiz();
    },
    handleSubmit: function (currentQuestion) {
        const selectedOptions = [];
        currentQuestion.querySelectorAll("input:checked").forEach((input) => {
            input = input.parentElement.option;
            selectedOptions.push(input),
                input.weight.forEach((name) => {
                    var resultItem = this.config.results.find((result) => result.name === name);
                    resultItem && (resultItem.count += 1);
                });
        }),
            (currentQuestion.style.display = "none"),
            this.currentQuestionIndex++,
            this.currentQuestionIndex < this.config.questions.length ? this.showNextQuestion() : this.showResults();
    },
    showNextQuestion: function () {
        var questionElements = this.container.querySelector(".quiz-container").querySelectorAll(".question");
        questionElements[this.currentQuestionIndex] &&
            (questionElements[this.currentQuestionIndex].style.display = "block");
    },
    showResults: function () {
        const maxCount = Math.max(...this.config.results.map((result) => result.count));
        var topResults = this.config.results.filter((result) => result.count === maxCount);
        const highestResult = topResults[Math.floor(Math.random() * topResults.length)],
            resultsDiv = document.createElement("div");
        resultsDiv.classList.add("results");
        var img,
            topResults = () => {
                var headlineElement = document.createElement("h2"),
                    imageElement =
                        ((headlineElement.textContent = highestResult.headline),
                        resultsDiv.appendChild(headlineElement),
                        highestResult.image &&
                            ((headlineElement = document.createElement("div")).classList.add("image-container"),
                            ((imageElement = document.createElement("img")).src = highestResult.image),
                            (imageElement.alt = highestResult.name),
                            headlineElement.appendChild(imageElement),
                            resultsDiv.appendChild(headlineElement)),
                        document.createElement("p")),
                    headlineElement =
                        ((imageElement.textContent = highestResult.text),
                        resultsDiv.appendChild(imageElement),
                        highestResult.cta &&
                            ((headlineElement = document.createElement("div")).classList.add("btn"),
                            (headlineElement.textContent = highestResult.cta),
                            headlineElement.addEventListener("click", () => {
                                customEvent("cta click", { result: highestResult });
                            }),
                            resultsDiv.appendChild(headlineElement)),
                        highestResult.additionalCta &&
                            ((imageElement = document.createElement("div")).classList.add("additional-cta"),
                            (imageElement.textContent = highestResult.additionalCta),
                            imageElement.addEventListener("click", (e) => {
                                customEvent("additional cta click", { result: highestResult });
                            }),
                            resultsDiv.appendChild(imageElement)),
                        this.container.appendChild(resultsDiv),
                        customEvent("results shown", { result: highestResult }),
                        this.container.querySelector(".quiz-container"));
                headlineElement && (headlineElement.style.display = "none");
            };
        highestResult.image
            ? (((img = new window.Image()).src = highestResult.image),
              (img.onload = topResults),
              (img.onerror = topResults))
            : topResults();
    },
    createOption: function (option, question, isMultiSelect) {
        const optionContainer = document.createElement("div"),
            input =
                (optionContainer.classList.add("option"),
                (optionContainer.option = option),
                document.createElement("input"));
        (input.type = isMultiSelect ? "checkbox" : "radio"),
            (input.name = isMultiSelect ? "" : "question-" + question.dataset.domIndex),
            (input.id = "option-" + Math.random());
        var label = document.createElement("label");
        return (
            (label.htmlFor = input.id),
            (label.textContent = option.text),
            (input.style.pointerEvents = "none"),
            (label.style.pointerEvents = "none"),
            optionContainer.appendChild(input),
            optionContainer.appendChild(label),
            optionContainer.addEventListener("click", (e) => {
                optionContainer.classList.contains("selected")
                    ? optionContainer.classList.remove("selected")
                    : optionContainer.classList.add("selected"),
                    isMultiSelect
                        ? ((input.checked = !input.checked), this.updateSubmitButton(question))
                        : ((input.checked = !0), this.handleSubmit(question)),
                    customEvent("option selected", option);
            }),
            optionContainer
        );
    },
    updateSubmitButton: function (question) {
        var submitButton = question.querySelector(".submit-button"),
            question = question.querySelectorAll("input:checked");
        submitButton.disabled = 0 === question.length;
    },
    shuffleArray: function (array) {
        var shuffled = [...array];
        for (let i = shuffled.length - 1; 0 < i; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    },
    createQuestion: function (item, index) {
        const question = document.createElement("div");
        question.classList.add("question"), (question.style.display = 0 === index ? "block" : "none");
        var questionText = document.createElement("h2");
        (questionText.textContent = item.question), question.appendChild(questionText);
        const optionsContainer = document.createElement("div");
        return (
            optionsContainer.classList.add("options-container"),
            question.appendChild(optionsContainer),
            (this.config.shuffle ? this.shuffleArray(item.options) : item.options).forEach((option) => {
                option = this.createOption(option, question, this.config.multiSelect);
                optionsContainer.appendChild(option);
            }),
            this.config.multiSelect &&
                ((questionText = document.createElement("button")).classList.add("submit-button"),
                (questionText.textContent =
                    index === this.config.questions.length - 1 ? "See Results" : "Next Question"),
                (questionText.disabled = !0),
                questionText.addEventListener("click", () => this.handleSubmit(question)),
                question.appendChild(questionText)),
            question
        );
    },
    createQuiz: function () {
        var quizContainer = document.createElement("div");
        quizContainer.classList.add("quiz-container"), this.container.appendChild(quizContainer);
        const quiz = document.createElement("div");
        quiz.classList.add("quiz"),
            quizContainer.appendChild(quiz),
            (this.config.shuffle ? this.shuffleArray(this.config.questions) : this.config.questions).forEach(
                (item, index) => {
                    item = this.createQuestion(item, index);
                    quiz.appendChild(item);
                }
            );
    },
    ready: function () {
        this.config && this.config.readyCallback && this.config.readyCallback();
    },
    destroy: function () {},
};
</script>

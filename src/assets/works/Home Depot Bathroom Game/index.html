<!DOCTYPE html><html><head>
<meta charset="UTF-8">
<meta name="ad.frame" content="child">
<title>ACE - Ad Building Framework</title>
<style>
  /* include your CSS styles like this */
  /* if you want to use separate CSS files, include into main CSS like this */
*,
*::after,
*::before,
html {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

#container {
  width: 970px;
  height: 250px;
  position: relative;
  cursor: pointer;
}

.frame {
  background-repeat: no-repeat;
}

#lockup {
  width: 448px;
  height: 250px;
  position: absolute;
  left: 0;
}

#lockup .frame {
  width: 448px;
  height: 250px;
  position: absolute;
  top: 0;
  background-position-y: bottom;
}

#frame-1 {
  background-image: url("assets/game-start.png");
}

#frame-2 {
  background-image: url("assets/game-running.png");
}

#frame-3 {
  background-image: url("assets/game-end.png");
}

#image {
  position: absolute;
  width: 522px;
  right: 0;
}

#image .frame {
  height: 250px;
  position: absolute;
}

#image-start {
  width: 100%;
  background-image: url("assets/bathroom-1.jpg");
}

#image-1 {
  width: 168px;
  background-image: url("assets/bathroom-2.jpg");
}

#image-2 {
  left: 168px;
  width: 199px;
  background-image: url("assets/bathroom-2.jpg");
  background-position-x: -168px;
}

#image-3 {
  left: 367px;
  width: 156px;
  background-image: url("assets/bathroom-2.jpg");
  background-position-x: -367px;
}

#image-end {
  width: 100%;
  background-image: url("assets/bathroom-1.jpg");
}

#timer {
  width: 93px;
  height: 37px;
  position: absolute;
  top: 179px;
  left: 178px;
  line-height: 37px;
  font-weight: bold;
  font-size: 20px;
  color: #ffffff;
  text-align: center;
  user-select: none;
  pointer-events: none;
}

.active {
  pointer-events: all;
  opacity: 1;
}

.inactive {
  opacity: 0;
  pointer-events: none;
}

#cta-btn, #replay-btn {
  position: absolute;
  left: 833px;
  top: 5px;
  width: 127px;
  height: 40px;
  cursor: pointer;
}

#cta-btn {
  background: url("assets/btn-shop.png") top left no-repeat;
}

#replay-btn {
  background: url("assets/btn-replay.png") top left no-repeat;
}

#start-btn {
  position: absolute;
  left: 209px;
  margin-left: -100px;
  bottom: 12px;
  width: 230px;
  height: 51px;
}

.replay-btn {
  opacity: 0;
};
</style>
<script src="/assets/libraries/AD.js"></script>
</head>

<body>
  <div id="container">
    <div id="lockup">
      <div id="frame-1" class="frame active">
        <div id="start-btn"></div>
      </div>
      <div id="frame-2" class="frame inactive">
        <div id="timer">
          :15
        </div>
      </div>
      <div id="frame-3" class="frame inactive"></div>
    </div>
    <div id="image">
      <div id="image-start" class="frame active"></div>
      <div id="image-1" class="frame inactive"></div>
      <div id="image-2" class="frame inactive"></div>
      <div id="image-3" class="frame inactive"></div>
      <div id="image-end" class="frame inactive"></div>
    </div>
    <div id="cta-btn" class="active"></div>
    <div id="replay-btn" class="inactive"></div>
  </div>

  <script>

andleClick,$AD.Utilities.byId("replay-btn").onclick=handleClick,$AD.Utilities.byId("frame-1").onclick=handleClick,$AD.Utilities.byId("frame-2").onclick=handleClick,$AD.Utilities.byId("frame-3").onclick=handleClick}$AD.ready(init);</script>

</body></html>

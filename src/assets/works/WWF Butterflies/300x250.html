html {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
  text-rendering: optimizeLegibility;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

#container {
  width: 300px;
  height: 250px;
  position: relative;
  overflow: hidden;
  background: white url("assets/WWF_MovewithNature_300x250.jpg") top left no-repeat;
  background-size: contain;
}

#initialStart {
  width: 100%;
  height: 100%;
  position: absolute;
  user-select: none;
  pointer-events: none;
}

.butterfly {
  width: 146px;
  height: 84px;
  position: absolute;
  perspective: 300px;
  transform-origin: center center;
  pointer-events: none;
  user-select: none;
}

.wing {
  width: 63px;
  height: 84px;
  position: absolute;
  background: transparent url("assets/wing.png") no-repeat center right;
  background-size: contain;
  transform-origin: center right;
}

.wing.left {
  left: 0;
}

.wing.right {
  right: 80px;
  transform: scaleX(-1);
}

.body {
  width: 20px;
  height: 84px;
  position: absolute;
  left: 55px;
  background: transparent url("assets/body.png") no-repeat center center;
  background-size: contain;
};
</style>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="ad.frame" content="child">
<meta name="ad.size" content="width=1080,height=1920">
<title>ACE - Ad Building Framework</title>
<style>
  *,
  *::after,
  *::before,
  html {
    -moz-osx-font-smoothing: grayscale;
    -webkit-font-smoothing: antialiased;
    box-sizing: border-box;
    text-rendering: optimizeLegibility;
  }
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
    font-family: "Open Sans", sans-serif;
  }
  #container {
    width: 1080px;
    height: 1920px;
    background: white url("assets/background.png") top left no-repeat;
  }
  #intro-container {
    width: 100%;
    height: 100%;
    position: absolute;
    pointer-events: none;
  }
  #headline-container,
  .headline {
    width: 100%;
    height: 100%;
    position: absolute;
    pointer-events: none;
  }
  #headline-sugar {
    background: transparent url("assets/headline-sugar.png") top left no-repeat;
    opacity: 0;
  }
  #headline-protein {
    background: transparent url("assets/headline-protein.png") top left no-repeat;
    opacity: 0;
  }
  #headline-go {
    background: transparent url("assets/headline-go.png") top left no-repeat;
    opacity: 0;
  }
  #cow-head {
    width: 209px;
    height: 199px;
    background: transparent url("assets/cow-head.png") top left no-repeat;
    opacity: 0;
    position: absolute;
    top: 288px;
    right: 20px;
    transform-origin: center center;
  }
  #banner-container {
    width: 100%;
    height: 100%;
    position: absolute;
  }
  #sideelements {
    width: 100%;
    height: 100%;
    background: transparent url("assets/sideelements.png") top left no-repeat;
    position: absolute;
    opacity: 0;
  }
  #ui {
    width: 100%;
    height: 100%;
    position: absolute;
    background: transparent url("assets/ui.png") top left no-repeat;
    opacity: 0;
    pointer-events: none;
  }
  #hotspot {
    width: 95px;
    height: 95px;
    border-radius: 95px;
    background-color: #3f1518;
    color: #ffffff;
    line-height: 100px;
    font-size: 125px;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 100;
    position: absolute;
    top: 579px;
    left: 734px;
    pointer-events: all;
  }
  #gallery-container {
    position: absolute;
    opacity: 0;
  }
  .arrow {
    width: 200px;
    height: 200px;
    position: absolute;
    top: 870px;
    pointer-events: all;
  }
  #arrow-right {
    right: 0;
  }
  #module {
    display: none;
    width: 100%;
    height: 100%;
    position: absolute;
  }
  .module-1 {
    background: transparent url("assets/module-chocolate.png") top left no-repeat;
  }
  .module-2 {
    background: transparent url("assets/module-strawberry.png") top left no-repeat;
  }
  .module-3 {
    background: transparent url("assets/module-cookies.png") top left no-repeat;
  }
  .module-4 {
    background: transparent url("assets/module-plain.png") top left no-repeat;
  }
  #module-close {
    width: 100%;
    height: 100%;
    position: absolute;
  }
  #module-hit {
    width: 926px;
    height: 1292px;
    position: absolute;
    left: 87px;
    top: 300px;
  }
</style>
<script src="/assets/libraries/AD.js"></script>
<script src="/assets/libraries/gsap.min.js"></script>

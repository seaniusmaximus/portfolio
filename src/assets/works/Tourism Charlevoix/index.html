:root {

  --secondaryColor: #e89d3f;
}

.etna-condensed {
  font-family: "etna-condensed", sans-serif;
  font-weight: 400;
  font-style: normal;
}

#container {
  width: 300px;
  height: 600px;
  position: relative;
  background-color: var(--primaryColor);
  overflow: hidden;
  cursor: pointer;
  display: none;
}

#logo {
  width: 132px;
  height: 32px;
  position: absolute;
  top: 25px;
  left: 84px;
}

#logo path {
  fill: var(--secondaryColor);
}

#image-container {
  width: 300px;
  height: 600px;
}

#image-container > * {
  width: 100%;
  height: 100%;
  position: absolute;
  background-size: contain;
  background-position: center center;
}

#overlay svg {
  fill: var(--primaryColor);
}

#cta {
  width: 100%;
  height: 40px;
  position: absolute;
  top: 540px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#cta-text {
  font-size: 41px;
  padding-right: 16px;
  color: var(--secondaryColor);
  margin-top: -10px;
  user-select: none;
}

#cta-circle {
  height: 40px;
  width: 40px;
  border-radius: 50%;
  border: 2px solid var(--secondaryColor);
  position: relative;
  overflow: hidden;
}

#cta-arrow {
  width: 70%;
  height: 70%;
  position: absolute;
  left: 50%;
  top: 55%;
  fill: var(--secondaryColor);
  transform: translate(-50%, -50%);
  animation-name: slide-right;
  animation-duration: 2s;
  animation-delay: 2s;
  animation-iteration-count: 7;
  animation-fill-mode: forwards;
}

@keyframes slide-right {
  0% {
    transform: translate(-50%, -50%);
  }
  50% {
    transform: translate(100%, -50%);
    opacity: 1;
  }
  51% {
    opacity: 0;
  }
  52% {
    transform: translate(-200%, -50%);
  }
  53% {
    opacity: 1;
  }
}
#curtain {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  background-color: #ffffff;
  pointer-events: none;
};

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SizeManager Library Demo</title>

    <!-- Include the Isi library -->
    <script src="/assets/libraries/AD.js"></script>
    <script src="SizeManager.js" language="javascript" type="module"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #SizeManagerContainer {
          width: 100vw;
          height: 100vh;
          border: 2px solid #000;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
      }
      #AdBox {
          width: 100%;
          height: 100%;
          background-color: #f0f0f0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          text-align: center;
          color: #1b1b1b;
          font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
          transition: background-color 220ms ease, color 220ms ease, font 220ms ease;
      }
      #AdBox h1 {
          font-size: 0.5rem;
          letter-spacing: 0.01em;
      }
      #AdBox p {
          max-width: 42ch;
          font-size: 0.25rem;
          line-height: 1.45;
      }
      .wide {
          width: 600px !important;
          border: 3px solid #7f1d1d;
          background: linear-gradient(135deg, #fecaca 0%, #fca5a5 100%) !important;
          color: #4a0404 !important;
          font-family: Georgia, "Times New Roman", serif !important;
        }
        .wide h1 {
          font-size: 2.15rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        .wide p {
          font-style: italic;
          font-size: 1.02rem;

        }
        .mid {
          width: 400px !important;
          border: 3px solid #92400e;
          background: linear-gradient(135deg, #fde68a 0%, #fdba74 100%) !important;
          color: #4b2a00 !important;
          font-family: "Verdana", "Trebuchet MS", sans-serif !important;
        }
        .mid h1 {
          font-size: 1.85rem;
          letter-spacing: 0.03em;
        }
        .mid p {
          font-size: 0.95rem;
        }
        .mobile {
          width: 300px !important;
          border: 3px solid #14532d;
          background: linear-gradient(135deg, #bbf7d0 0%, #86efac 100%) !important;
          color: #062b17 !important;
          font-family: "Courier New", Courier, monospace !important;
        }
        .mobile h1 {
          font-size: 1.5rem;
          letter-spacing: 0;
        }
        .mobile p {
          font-size: 0.86rem;
          line-height: 1.35;
        }
    </style>
  </head>
  <body>
    <div id="SizeManagerContainer">
      <div id="AdBox">
        <h1>SizeManager Plugin Demo</h1>
        <p>The SizeManager plugin helps manage and adjust the size of ad containers dynamically.</p>
        <p>Open the console to see debug messages from the SizeManager plugin.</p>
      </div>
    </div>

    <script type="module">
      import SizeManager from './SizeManager.js'
      // Initialize the SizeManager plugin when $AD is ready
      $AD.ready(() => {
        // Create an instance of the SizeManager plugin
        const sizeManager = new SizeManager({
          containerID: 'SizeManagerContainer',
          adId: 'AdBox', // Assuming there's an element with this ID
          scaleBetween: true,
          center: true,
          breakpoints: [
            { class: 'wide', ratio: '16:3' },
            { class: 'mid', ratio: '40:9' },
            { class: 'mobile', ratio: '16:9' },
          ],
          debug: true
        });
        sizeManager.init();
        // Example usage of SizeManager methods can be added here
      });
    </script>
  </body>
</html>
